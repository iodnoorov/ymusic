[workspace]
members = ["crates/*"]
# `cargo build` and `cargo test` in the root take all the crates.
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "3.7.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/iodnoorov/ymusic"

[workspace.dependencies]
ymusic-api = { path = "crates/ymusic-api" }
ymusic-core = { path = "crates/ymusic-core" }
ymusic-player = { path = "crates/ymusic-player" }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
await_holding_lock = "warn"

[package]
name = "ymusic-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal client for Yandex Music: My Wave, likes, stations"
readme = "README.md"
keywords = ["yandex", "music", "tui", "player", "cli"]
categories = ["command-line-utilities", "multimedia::audio"]
# Installed from the repository (AUR, `cargo install --git`), not from crates.io.
publish = false

[[bin]]
name = "ymusic"
path = "src/main.rs"

[dependencies]
ymusic-api.workspace = true
ymusic-core.workspace = true
ymusic-player.workspace = true
anyhow.workspace = true
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
image.workspace = true
libc.workspace = true
ratatui = "0.29"
ratatui-image = { version = "8.1", default-features = false, features = ["crossterm"] }
serde.workspace = true
serde_json.workspace = true
signal-hook = "0.3"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[dev-dependencies]
ymusic-core = { workspace = true, features = ["testing"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "6", default-features = false, features = ["default-rt", "service"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSImage"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFRunLoop", "CFString"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSGeometry", "NSObject", "NSString", "NSURL", "NSValue"] }
objc2-media-player = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "MPNowPlayingInfoCenter", "MPRemoteCommandCenter", "MPRemoteCommand", "MPRemoteCommandEvent", "MPMediaItem", "MPMediaItemCollection", "MPMediaEntity", "MPRemoteControlTypes", "objc2-core-foundation"] }

[lints]
workspace = true

# deb and rpm packages of the static release binary (packaging/packages.sh):
# `cargo deb` / `cargo generate-rpm` with `--target <arch>-unknown-linux-musl`.
[package.metadata.deb]
name = "ymusic-cli"
maintainer = "Ivan Odnoorov <elcheshirecat@yandex.ru>"
license-file = "LICENSE"
extended-description = "Terminal client for Yandex Music: My Wave, stations, likes, search, playlists, its own player."
section = "sound"
# A static binary: nothing to depend on.
depends = ""
recommends = "pipewire-pulse | pulseaudio"
assets = [
    ["target/release/ymusic", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/ymusic-cli/", "644"],
    ["LICENSE-FDK-AAC", "usr/share/doc/ymusic-cli/", "644"],
]

[package.metadata.generate-rpm]
name = "ymusic-cli"
summary = "Terminal client for Yandex Music"
# The FDK AAC decoder is built in.
license = "MIT AND FDK-AAC"
auto-req = "no"
assets = [
    { source = "target/release/ymusic", dest = "/usr/bin/ymusic", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/ymusic-cli/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/ymusic-cli/LICENSE", mode = "644", doc = true },
    { source = "LICENSE-FDK-AAC", dest = "/usr/share/licenses/ymusic-cli/LICENSE-FDK-AAC", mode = "644", doc = true },
]

[package.metadata.generate-rpm.recommends]
pipewire-pulseaudio = "*"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
