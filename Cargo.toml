[package]
name = "ymusic-cli"
version = "3.1.1"
edition = "2021"
rust-version = "1.89"
description = "Terminal client for Yandex Music: My Wave, likes, stations"
license = "MIT"
repository = "https://github.com/iodnoorov/ymusic"
readme = "README.md"
keywords = ["yandex", "music", "tui", "player", "cli"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "ymusic"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
fdk-aac = "0.8"
hmac = "0.12"
md-5 = "0.10"
ratatui = "0.29"
ratatui-image = { version = "8.1", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulseaudio = "0.3.2"
sha2 = "0.10"
symphonia = { version = "0.6.1", default-features = false, features = ["isomp4", "aac", "mp3"] }
symphonia-adapter-fdk-aac = "0.2"
signal-hook = "0.3"
ureq = { version = "2", features = ["json"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
rustls-native-certs = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "6", default-features = false, features = ["default-rt", "service"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSImage"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFRunLoop", "CFString"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSGeometry", "NSObject", "NSString", "NSURL", "NSValue"] }
objc2-media-player = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "MPNowPlayingInfoCenter", "MPRemoteCommandCenter", "MPRemoteCommand", "MPRemoteCommandEvent", "MPMediaItem", "MPMediaItemCollection", "MPMediaEntity", "objc2-core-foundation"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
