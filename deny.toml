# cargo-deny: known vulnerabilities, licenses and sources of the dependencies.
# Locally: cargo deny check

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
# Unmaintained crates are reported as warnings by `yanked`/`unmaintained` below, not failures.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Permissive licenses and MPL-2.0 (symphonia: file-level copyleft, our code stays MIT).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The workspace's own crates are referred to by path; none is published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
