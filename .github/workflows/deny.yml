name: Зависимости

# Known vulnerabilities, licenses and sources (deny.toml). Weekly too: an advisory may appear for
# a dependency nobody touched.
on:
  push:
    branches: [main]
    paths: [Cargo.lock, Cargo.toml, "crates/*/Cargo.toml", deny.toml, .github/workflows/deny.yml]
  pull_request:
    paths: [Cargo.lock, Cargo.toml, "crates/*/Cargo.toml", deny.toml, .github/workflows/deny.yml]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
